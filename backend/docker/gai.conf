# Address selection for build/runtime containers: prefer IPv6 over IPv4.
#
# Docker Desktop's dual-stack mode gives containers only a ULA IPv6 address
# (fc00::/7). With glibc's default RFC 6724 table, ULA → global IPv6 loses to
# IPv4, so Python connects over IPv4 first. On some networks the IPv4 route to
# PyPI's CDN runs at ~30 kB/s while IPv6 runs at MB/s. Labelling ULA like
# global IPv6 makes IPv6 win. Without IPv6, getaddrinfo returns only IPv4 and
# nothing changes.
#
# Setting any line here replaces glibc's whole default table, so the rest of
# the default is repeated below.
label ::1/128       0
label ::/0          1
label fc00::/7      1
label 2002::/16     2
label ::/96         3
label ::ffff:0:0/96 4

precedence ::1/128       50
precedence ::/0          40
precedence fc00::/7      40
precedence 2002::/16     30
precedence ::/96         20
precedence ::ffff:0:0/96 10
