# ── What runs where ────────────────────────────────────────────────────────────
# Postgres and Redis are NOT in this file:
#   - Postgres: the local (native) install on the host, port 5434.
#   - Redis:    the standalone `code-motion` container, port 6379
#               (docker run -d --name code-motion -p 6379:6379 --restart unless-stopped redis:7-alpine)
# Containers reach both through host.docker.internal.
#
# ── How env vars work ──────────────────────────────────────────────────────────
# env_file loads backend/.env (OPENROUTER_API_KEY, LLM_*, DATABASE_URL, ...),
# then backend/.env.docker, which overrides only what differs inside a
# container — the hosts. Create backend/.env.docker (gitignored) with:
#
#   DATABASE_URL=postgresql+asyncpg://code_motion:<password>@host.docker.internal:5434/code_motion
#   REDIS_URL=redis://host.docker.internal:6379/0
#
# backend/.env keeps localhost for running uvicorn/Celery directly from the venv.
# ──────────────────────────────────────────────────────────────────────────────

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
      - ./backend/.env.docker
    environment:
      APP_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./media:/app/media
    healthcheck:
      # python, not curl — the slim API image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
      - ./backend/.env.docker
    environment:
      APP_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./media:/app/media
